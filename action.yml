name: "AI Code Reviewer"
description: "Automated code review using Cursor Agent SDK with Clean Architecture standards"
author: "vincetran"

branding:
  icon: "check-circle"
  color: "blue"

inputs:
  openrouter-api-key:
    description: "API key for Cursor review. Secret name stays OPENROUTER_API_KEY; value must be a Cursor API key"
    required: true
  github-token:
    description: "GitHub token for posting PR comments (use secrets.GITHUB_TOKEN)"
    required: true
  stack:
    description: "Stack công nghệ mà dự án đang sử dụng"
    required: true
  rules-path:
    description: "Đường dẫn đến thư mục chứa các file .md rules review"
    required: true
  review-language:
    description: 'Language for code review comments: "vietnamese" or "english"'
    required: false
    default: "vietnamese"
  openrouter-model:
    description: "Ignored. Model is hardcoded in this repo (scripts/reviewer/config.py). Kept so existing CI YAML does not break."
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install Python dependencies
      shell: bash
      run: |
        python -m pip install --upgrade pip
        pip install -r ${{ github.action_path }}/scripts/requirements.txt

    - name: Install Cursor CLI
      shell: bash
      run: |
        curl https://cursor.com/install -fsS | bash
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"
        echo "$HOME/.cursor/bin" >> "$GITHUB_PATH"

    - name: Run Cursor AI Code Reviewer
      shell: bash
      env:
        CURSOR_API_KEY: ${{ inputs.openrouter-api-key }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
        STACK: ${{ inputs.stack }}
        RULES_PATH: ${{ inputs.rules-path }}
        GITHUB_REPOSITORY: ${{ github.repository }}
        GITHUB_REF: ${{ github.ref }}
        REVIEW_LANGUAGE: ${{ inputs.review-language }}
        GITHUB_WORKSPACE: ${{ github.workspace }}
      run: python ${{ github.action_path }}/scripts/ai_review.py
